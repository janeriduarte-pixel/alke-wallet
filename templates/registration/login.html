{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 60vh;">
    <div class="card border-0 shadow-sm p-4" style="width: 100%; max-width: 400px;">
        <div class="text-center mb-4">
            <i class="bi bi-wallet2 fs-1" style="color: var(--azul-oscuro);"></i>
            <h3 class="fw-bold mt-2" style="color: var(--azul-oscuro);">Alke Wallet</h3>
            <p class="text-muted small">Ingresa a tu cuenta</p>
        </div>

        {% if form.errors %}
            <div class="alert alert-danger">
                Usuario o contraseña incorrectos.
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Usuario</label>
                {{ form.username }}
            </div>
            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                {{ form.password }}
            </div>
            <button type="submit" class="btn btn-acento w-100">
                <i class="bi bi-box-arrow-in-right"></i> Ingresar
            </button>
            <p class="text-center small mt-3">¿No tienes cuenta? <a href="{% url 'registro' %}">Regístrate</a></p>
        </form>
    </div>
</div>
{% endblock %}
