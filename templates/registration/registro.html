{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 60vh;">
    <div class="card border-0 shadow-sm p-4" style="width: 100%; max-width: 400px;">
        <div class="text-center mb-4">
            <i class="bi bi-person-plus fs-1" style="color: var(--azul-oscuro);"></i>
            <h3 class="fw-bold mt-2" style="color: var(--azul-oscuro);">Crear cuenta</h3>
        </div>
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
                <div class="mb-3">
                    <label class="form-label">{{ field.label }}</label>
                    {{ field }}
                    {% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
                    {% if field.errors %}<div class="text-danger small">{{ field.errors }}</div>{% endif %}
                </div>
            {% endfor %}
            <button type="submit" class="btn btn-acento w-100">Registrarme</button>
        </form>
        <p class="text-center small mt-3">¿Ya tienes cuenta? <a href="{% url 'login' %}">Ingresa aquí</a></p>
    </div>
</div>
{% endblock %}
