{% extends 'base.html' %}
{% block content %}
<div class="page-header">
    <h2>
        <i class="bi bi-{% if form.instance.pk %}pencil-square{% else %}plus-circle{% endif %}"></i>
        {% if form.instance.pk %}Editar cuenta{% else %}Nueva cuenta{% endif %}
    </h2>
</div>

<div class="card border-0 shadow-sm" style="max-width: 500px;">
    <div class="card-body p-4">
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
                <div class="mb-3">
                    <label class="form-label">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <div class="text-danger small mt-1">{{ field.errors }}</div>
                    {% endif %}
                </div>
            {% endfor %}
            <div class="d-flex gap-2 mt-3">
                <button type="submit" class="btn btn-acento flex-grow-1">
                    <i class="bi bi-check-circle"></i> Guardar
                </button>
                <a href="{% url 'cuenta-list' %}" class="btn btn-outline-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
