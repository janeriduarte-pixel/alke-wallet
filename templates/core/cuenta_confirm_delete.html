{% extends 'base.html' %}
{% block content %}
<h2>Eliminar cuenta</h2>
<p>¿Seguro que quieres eliminar la cuenta <strong>{{ object.tipo }}</strong> de <strong>{{ object.cliente.nombre }}</strong>?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Sí, eliminar</button>
    <a href="{% url 'cuenta-list' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
