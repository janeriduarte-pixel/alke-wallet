{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alke Wallet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/estilos.css' %}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-alke mb-4">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="{% url 'cuenta-list' %}">
                <i class="bi bi-wallet2"></i> Alke<span>Wallet</span>
            </a>
            {% if user.is_authenticated %}
                <span class="text-white me-3 d-none d-md-inline">
                    <i class="bi bi-person-circle"></i> {{ user.username }}
                </span>
                <form method="post" action="{% url 'logout' %}" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-light btn-sm">
                        <i class="bi bi-box-arrow-right"></i> Salir
                    </button>
                </form>
            {% else %}
                <a class="btn btn-acento btn-sm" href="{% url 'login' %}">Ingresar</a>
            {% endif %}
        </div>
    </nav>
 
    <div class="container">
        {% block content %}{% endblock %}
    </div>
 
    <footer class="text-center text-muted small py-4 mt-5">
        <hr class="mb-3">
        <i class="bi bi-shield-check"></i> Alke Wallet — Proyecto Módulo 7, Alkemy © 2026
    </footer>
 
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
